<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>탄막 조립선</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="opening.css" />
</head>
<body>
  <div id="wrap">
    <header>
      <div class="top">
        <strong>탄막 조립선 <span class="ver">1.0</span></strong>
        <div class="stat" id="stats"></div>
        <button id="helpBtn" type="button">도움말 (H)</button>
      </div>
      <div class="hotbar" id="hotbar"></div>
      <p id="coach">발전기를 맵에 놓아 전력을 켜라.</p>
    </header>
    <div id="stage">
      <div id="play">
        <canvas id="c"></canvas>
        <div id="toast"></div>
        <div id="ammoWarn" class="hidden">탄약 없음 — 장전 키는 없다. 노란 탄약을 줍거나 조립기 엽에 서라</div>
        <div id="overlay">
          <div class="card" id="card">
            <p class="log-tag">직조함 N-07 · 블랙박스 · 릴리스 1.0</p>
            <h1>탄막 조립선</h1>
            <p class="lead">함은 스스로 쏠다. 탄약이 없으면 공장이 죽는다.</p>
            <button id="startBtn" type="button">거점 선택</button>
            <a href="guide.html" id="guideBtn" class="ghost">처음이라면 — 작전 설명</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="opening" class="opening">
    <video id="openingVid" src="opening.mp4" poster="opening-poster.jpg" playsinline muted autoplay></video>
    <button type="button" id="openingArm" class="opening-arm">소리 켜기</button>
    <button type="button" id="openingSkip">건너뛰기</button>
  </div>
  <script>
    (function () {
      const box = document.getElementById("opening");
      const vid = document.getElementById("openingVid");
      const skip = document.getElementById("openingSkip");
      const arm = document.getElementById("openingArm");
      function done() {
        if (!box || box.classList.contains("off")) return;
        box.classList.add("off");
        try { vid.pause(); } catch (e) {}
        if (typeof window.showHub === "function") window.showHub();
      }
      function playOpening() {
        if (!box || !vid) return;
        box.classList.remove("off");
        vid.currentTime = 0;
        vid.muted = true;
        vid.volume = 0.85;
        const p = vid.play();
        if (p && p.catch) p.catch(function () { arm.classList.remove("hidden"); });
        arm.classList.remove("hidden");
        arm.textContent = "소리 켜기";
      }
      window.playOpening = playOpening;
      arm.addEventListener("click", function (e) {
        e.stopPropagation();
        vid.muted = false;
        vid.play().catch(function () {});
        arm.classList.add("hidden");
      });
      vid.addEventListener("ended", done);
      skip.addEventListener("click", function (e) { e.stopPropagation(); done(); });
      window.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !box.classList.contains("off")) done();
      });
      playOpening();
    })();
  </script>
  <script src="game.js"></script>
  <script src="opening-hub.js"></script>
</body>
</html>
